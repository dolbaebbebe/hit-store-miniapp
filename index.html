
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HIT STORE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:#fff;font-family:Arial,sans-serif;padding-bottom:85px}
header{padding:24px 18px;background:linear-gradient(135deg,#101c35,#080b12)}
.logo{font-size:25px;font-weight:900;letter-spacing:2px}
.logo span{color:#38a5ff}
header p{color:#9daac1;font-size:13px}
.search{width:100%;padding:14px;border:1px solid #26334a;border-radius:13px;background:#111827;color:white;font-size:15px;outline:none}
h2{font-size:19px;margin:23px 18px 14px}
.categories{display:flex;gap:8px;overflow:auto;padding:0 18px}
.cat{white-space:nowrap;border:1px solid #26334a;background:#111827;color:#c7d5e9;padding:10px 14px;border-radius:20px}
.cat.active{background:#1689ff;color:white;border-color:#1689ff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px}
.card{background:#111722;border:1px solid #202b3d;border-radius:17px;padding:13px;min-width:0}
.appicon{width:53px;height:53px;border-radius:15px;background:#1d3454;display:grid;place-items:center;font-size:27px}
.name{font-weight:bold;margin-top:12px;font-size:15px}
.desc{font-size:12px;color:#93a2b8;margin:7px 0 14px;min-height:28px}
.order{width:100%;padding:11px 4px;border:0;border-radius:10px;background:#1689ff;color:white;font-weight:bold;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:#0e1420;border-top:1px solid #263044;display:flex;justify-content:space-around;padding:13px 4px}
nav a{color:#9ba9be;text-decoration:none;font-size:12px;text-align:center}
nav a:first-child{color:#40a8ff}
.empty{grid-column:1/-1;color:#9ba9be;text-align:center;padding:30px}
</style>
</head>
<body>
<header>
  <div class="logo">HIT <span>STORE</span></div>
  <p>Твои приложения — в одном месте</p>
  <input class="search" id="search" placeholder="🔎 Найти приложение...">
</header>

<h2>Категории</h2>
<div class="categories" id="categories">
  <button class="cat active" data-cat="Все">Все</button>
  <button class="cat" data-cat="Банки">Банки</button>
  <button class="cat" data-cat="Социальные">Социальные</button>
  <button class="cat" data-cat="Игры">Игры</button>
  <button class="cat" data-cat="Другое">Другое</button>
</div>

<h2>Популярные приложения</h2>
<div class="grid" id="apps"></div>

<nav>
  <a href="#" onclick="showAll();return false">⌂<br>Главная</a>
  <a href="#categories">▦<br>Каталог</a>
  <a href="#" onclick="showFavorites();return false">♡<br>Избранное</a>
  <a href="https://t.me/TestminiappBBot">☻<br>Профиль</a>
</nav>

<script>
const items=[
 {name:"MAX",icon:"💬",cat:"Социальные",desc:"Общение и сообщения"},
 {name:"VK",icon:"🔵",cat:"Социальные",desc:"Музыка, видео и друзья"},
 {name:"СберБанк",icon:"💚",cat:"Банки",desc:"Банковские услуги"},
 {name:"Т-Банк",icon:"🟡",cat:"Банки",desc:"Финансы и платежи"},
 {name:"Minecraft",icon:"🟩",cat:"Игры",desc:"Игра и приключения"},
 {name:"Telegram",icon:"✈️",cat:"Социальные",desc:"Сообщения и каналы"},
 {name:"YouTube",icon:"▶️",cat:"Другое",desc:"Видео и развлечения"},
 {name:"Чат-рулетка",icon:"🎥",cat:"Социальные",desc:"Видеочаты"}
];
let category="Все",favorites=[],favOnly=false;
const apps=document.getElementById("apps");
function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=items.filter(x=>(category==="Все"||x.cat===category)&&
 x.name.toLowerCase().includes(q)&&(!favOnly||favorites.includes(x.name)));
 apps.innerHTML="";
 if(!list.length){apps.innerHTML='<div class="empty">Ничего не найдено</div>';return}
 list.forEach(x=>{
  const el=document.createElement("div");
  el.className="card";
  const icon=document.createElement("div");icon.className="appicon";icon.textContent=x.icon;
  const name=document.createElement("div");name.className="name";name.textContent=x.name;
  const desc=document.createElement("div");desc.className="desc";desc.textContent=x.desc;
  const fav=document.createElement("button");fav.className="cat";fav.textContent=favorites.includes(x.name)?"♥":"♡";
  fav.style.margin="0 0 10px";fav.onclick=()=>{favorites.includes(x.name)?favorites=favorites.filter(n=>n!==x.name):favorites.push(x.name);render()};
  const btn=document.createElement("button");btn.className="order";btn.textContent="Заказать";
  btn.onclick=()=>location.href="https://t.me/TestminiappBBot?start=app_"+encodeURIComponent(x.name.replace(/ /g,"_"));
  el.append(icon,name,desc,fav,btn);apps.append(el);
 });
}
document.getElementById("search").addEventListener("input",render);
document.querySelectorAll(".cat[data-cat]").forEach(b=>b.onclick=()=>{
 category=b.dataset.cat;favOnly=false;
 document.querySelectorAll(".cat[data-cat]").forEach(c=>c.classList.toggle("active",c===b));
 render();
});
function showAll(){category="Все";favOnly=false;document.getElementById("search").value="";render()}
function showFavorites(){category="Все";favOnly=true;render()}
render();
</script>
</body>
</html>
