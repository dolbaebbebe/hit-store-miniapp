<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b12">
<title>HIT STORE</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{margin:0;background:#080b12;color:#f5f7fb;font-family:Arial,Helvetica,sans-serif;padding-bottom:82px}
header{padding:25px 18px 20px;background:radial-gradient(ellipse at top right,#15345e 0%,#0c1424 48%,#080b12 100%)}
.logo{font-size:26px;font-weight:900;letter-spacing:2px}.logo span{color:#39a4ff}
header p{color:#9eabc0;font-size:13px;margin:8px 0 19px}
.search{width:100%;padding:14px 15px;border:1px solid #263650;border-radius:14px;background:#101827;color:#fff;font-size:15px;outline:none}
.search:focus{border-color:#1689ff}
h2{font-size:19px;margin:23px 18px 14px}
.categories{display:flex;gap:8px;overflow-x:auto;padding:0 18px 4px;scrollbar-width:none}
.categories::-webkit-scrollbar{display:none}
.cat{white-space:nowrap;border:1px solid #26334a;background:#111827;color:#c7d5e9;padding:10px 14px;border-radius:20px;font-size:13px}
.cat.active{background:#1689ff;color:white;border-color:#1689ff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 14px}
.card{background:linear-gradient(150deg,#131c2b,#0e141e);border:1px solid #202d40;border-radius:17px;padding:13px;min-width:0}
.appicon{width:58px;height:58px;border-radius:16px;background:#1b2a40;overflow:hidden;display:grid;place-items:center;border:1px solid #293a53}
.appicon img{width:100%;height:100%;object-fit:cover;display:block}
.fallback{font-size:26px;font-weight:bold;color:#45aaff}
.name{font-weight:bold;margin-top:12px;font-size:15px;overflow-wrap:anywhere}
.desc{font-size:12px;color:#93a2b8;margin:7px 0 13px;min-height:28px;line-height:1.35}
.actions{display:flex;gap:7px;align-items:center}
.order{flex:1;min-width:0;padding:11px 5px;border:0;border-radius:10px;background:#1689ff;color:white;font-weight:bold;font-size:12px}
.fav{width:39px;height:37px;border:1px solid #2a3a52;border-radius:10px;background:#182234;color:#dbeaff;font-size:18px}
.empty{grid-column:1/-1;color:#9ba9be;text-align:center;padding:32px 12px}
.notice{margin:18px 14px 0;color:#7e8da4;font-size:11px;line-height:1.45}
nav{position:fixed;z-index:5;bottom:0;left:0;right:0;background:rgba(13,19,30,.97);border-top:1px solid #263044;display:flex;justify-content:space-around;padding:12px 4px max(12px,env(safe-area-inset-bottom))}
nav button{background:none;border:0;color:#9ba9be;font-size:11px;line-height:1.5}
nav button.active{color:#40a8ff}
</style>
</head>
<body>
<header>
  <div class="logo">HIT <span>STORE</span></div>
  <p>Твои приложения — в одном месте</p>
  <input class="search" id="search" placeholder="⌕  Найти приложение..." aria-label="Поиск приложений">
</header>

<h2>Категории</h2>
<div class="categories" id="categories">
  <button class="cat active" data-cat="Все">Все</button>
  <button class="cat" data-cat="Банки">Банки</button>
  <button class="cat" data-cat="Социальные">Социальные</button>
  <button class="cat" data-cat="Игры">Игры</button>
  <button class="cat" data-cat="Другое">Другое</button>
</div>

<h2 id="sectionTitle">Популярные приложения</h2>
<div class="grid" id="apps"></div>
<p class="notice">Наличие приложений и возможность установки зависят от региона и устройства. Заказ отправит вас в Telegram-бот.</p>

<nav>
  <button class="active" id="homeTab">⌂<br>Главная</button>
  <button id="catalogTab">▦<br>Каталог</button>
  <button id="favoritesTab">♡<br>Избранное</button>
  <button id="profileTab">☻<br>Профиль</button>
</nav>

<script>
const BOT_USERNAME = "TestminiappBBot";
const items = [
 {name:"MAX",domain:"max.ru",fallback:"M",cat:"Социальные",desc:"Общение и сообщения"},
 {name:"VK",domain:"vk.com",fallback:"VK",cat:"Социальные",desc:"Музыка, видео и друзья"},
 {name:"СберБанк",domain:"sberbank.ru",fallback:"С",cat:"Банки",desc:"Банковские услуги"},
 {name:"Т-Банк",domain:"tbank.ru",fallback:"Т",cat:"Банки",desc:"Финансы и платежи"},
 {name:"Minecraft",domain:"minecraft.net",fallback:"M",cat:"Игры",desc:"Игра и приключения"},
 {name:"Telegram",domain:"telegram.org",fallback:"✈",cat:"Социальные",desc:"Сообщения и каналы"},
 {name:"YouTube",domain:"youtube.com",fallback:"▶",cat:"Другое",desc:"Видео и развлечения"},
 {name:"Чат-рулетка",domain:"chatroulette.com",fallback:"C",cat:"Социальные",desc:"Видеочаты"}
];
let category = "Все";
let favorites = [];
let favOnly = false;
const apps = document.getElementById("apps");
const search = document.getElementById("search");

function makeIcon(item){
 const box=document.createElement("div");
 box.className="appicon";
 const img=document.createElement("img");
 img.src="https://www.google.com/s2/favicons?domain="+encodeURIComponent(item.domain)+"&sz=128";
 img.alt=item.name;
 img.loading="lazy";
 img.onerror=()=>{
   box.innerHTML="";
   const fallback=document.createElement("span");
   fallback.className="fallback";
   fallback.textContent=item.fallback;
   box.appendChild(fallback);
 };
 box.appendChild(img);
 return box;
}
function render(){
 const q=search.value.trim().toLowerCase();
 const list=items.filter(x=>
   (category==="Все"||x.cat===category) &&
   x.name.toLowerCase().includes(q) &&
   (!favOnly||favorites.includes(x.name))
 );
 apps.innerHTML="";
 document.getElementById("sectionTitle").textContent=favOnly?"Избранное":"Популярные приложения";
 if(!list.length){
   const empty=document.createElement("div");
   empty.className="empty";
   empty.textContent=favOnly?"В избранном пока пусто":"Ничего не найдено";
   apps.appendChild(empty);
   return;
 }
 list.forEach(item=>{
   const card=document.createElement("article");card.className="card";
   card.appendChild(makeIcon(item));
   const name=document.createElement("div");name.className="name";name.textContent=item.name;
   const desc=document.createElement("div");desc.className="desc";desc.textContent=item.desc;
   const actions=document.createElement("div");actions.className="actions";
   const order=document.createElement("button");order.className="order";order.textContent="Заказать";
   order.onclick=()=>{window.location.href="https://t.me/"+BOT_USERNAME+"?start=app_"+encodeURIComponent(item.name.replace(/\s+/g,"_"));};
   const fav=document.createElement("button");fav.className="fav";fav.textContent=favorites.includes(item.name)?"♥":"♡";fav.setAttribute("aria-label","Добавить в избранное");
   fav.onclick=()=>{favorites.includes(item.name)?favorites=favorites.filter(n=>n!==item.name):favorites.push(item.name);render()};
   actions.append(order,fav);
   card.append(name,desc,actions);
   apps.appendChild(card);
 });
}
document.querySelectorAll(".cat[data-cat]").forEach(button=>button.addEventListener("click",()=>{
 category=button.dataset.cat;favOnly=false;
 document.querySelectorAll(".cat[data-cat]").forEach(b=>b.classList.toggle("active",b===button));
 render();
}));
search.addEventListener("input",render);
function showAll(){category="Все";favOnly=false;search.value="";document.querySelectorAll(".cat[data-cat]").forEach(b=>b.classList.toggle("active",b.dataset.cat==="Все"));render();}
document.getElementById("homeTab").onclick=()=>{showAll();setTab("homeTab")};
document.getElementById("catalogTab").onclick=()=>{showAll();document.getElementById("categories").scrollIntoView({behavior:"smooth"});setTab("catalogTab")};
document.getElementById("favoritesTab").onclick=()=>{favOnly=true;render();setTab("favoritesTab")};
document.getElementById("profileTab").onclick=()=>{window.location.href="https://t.me/"+BOT_USERNAME;};
function setTab(id){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.id===id))}
render();
</script>
</body>
</html>
